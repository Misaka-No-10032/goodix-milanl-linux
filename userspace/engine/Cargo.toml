[package]
name = "goodix-milanl-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Native MilanL fingerprint backend for libfprint"
license = "GPL-2.0-only"
publish = false

[dependencies]
libc = "=0.2.177"
sha2 = "=0.10.9"
subtle = "=2.6.1"
zeroize = "=1.8.2"

[profile.release]
lto = "thin"
strip = "debuginfo"
